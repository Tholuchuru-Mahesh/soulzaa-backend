name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/soulzaa-backend

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Code Quality
  # ─────────────────────────────────────────────────────────────────────────────
  quality:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read automatically from package.json#packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-v2-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type-check (tsc --noEmit)
        run: pnpm exec tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Unit Tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read automatically from package.json#packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-v2-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run unit tests
        run: pnpm test --passWithNoTests --forceExit --ci
        env:
          CI: true

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Security Scan (Trivy)
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Build & Push Docker Image
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Deploy to Production (EC2 + docker compose)
  #
  # Production is a single EC2 host running docker-compose.prod.yml behind nginx
  # — there is no Kubernetes cluster. This job SSHes in, fast-forwards the
  # checkout to the pushed commit, pulls the image `build` just published to
  # GHCR, and recreates only the `api` service. Postgres/Redis/pgbouncer/nginx
  # are left running.
  #
  # Deliberately pulls a prebuilt image rather than building on the box: the
  # artifact is the exact one that passed test + security-scan, and a t3-class
  # instance can OOM compiling it.
  #
  # DB migrations need no step here — the image's CMD runs
  # `prisma migrate deploy` before starting the server (see Dockerfile).
  #
  # Required repository secrets:
  #   EC2_SSH_KEY   private key whose public half is in ~/.ssh/authorized_keys
  #                 on the host (PEM, including the BEGIN/END lines)
  #   EC2_HOST      public IP or hostname of the instance
  #   EC2_USER      login user (e.g. ubuntu)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.soulzaa.com
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stops: true
          script: |
            set -euo pipefail
            cd ~/soulzaa-backend

            # Mirror the pushed commit exactly. Safe for the Firebase service
            # account key: it is gitignored and untracked, so reset leaves it be.
            git fetch --quiet origin main
            git reset --hard --quiet ${{ github.sha }}

            # Fail loudly rather than booting an API with no Firebase credential.
            test -f firebase-service-account.json

            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d --no-build api

            docker image prune -f

      - name: Wait for health
        run: |
          # Nest needs ~20-30s to boot; nginx returns 502 until then.
          for i in $(seq 1 24); do
            if curl -fsS --max-time 5 https://api.soulzaa.com/health/ready > /dev/null; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::/health/ready did not come up within 120s"
          exit 1

      - name: Report rollback command on failure
        if: failure()
        run: |
          echo "::error::Deploy failed. To roll back, SSH to the host and run:"
          echo "  cd ~/soulzaa-backend"
          echo "  git reset --hard ${{ github.event.before }}"
          echo "  docker compose -f docker-compose.prod.yml up -d api"
