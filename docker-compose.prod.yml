# Production Docker Compose — Soulzaaa Backend
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Secrets are injected via environment variables from the host or a secrets manager.
# Do NOT commit .env files containing real credentials.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: soulzaa-postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ── PgBouncer (connection pooler) ────────────────────────────────────────────
  pgbouncer:
    # Bitnami retired its public Docker Hub catalog (2025); the images live on
    # under bitnamilegacy/ and are frozen. Migrate to edoburu/pgbouncer when
    # convenient — it needs different env var names and listens on 5432.
    image: bitnamilegacy/pgbouncer:1.24.1-debian-12-r10
    container_name: soulzaa-pgbouncer
    restart: always
    logging: *default-logging
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT_NUMBER: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      PGBOUNCER_DATABASE: ${POSTGRES_DB}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 2000
      PGBOUNCER_DEFAULT_POOL_SIZE: 50
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The pgbouncer image ships no postgres client binaries — pg_isready exits
      # 127 and the probe can never pass. A raw TCP connect is what we actually
      # care about anyway: is the pooler accepting connections.
      test: ['CMD-SHELL', 'timeout 2 bash -c "</dev/tcp/127.0.0.1/6432"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ── Redis (with AOF persistence) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: soulzaa-redis
    restart: always
    logging: *default-logging
    # `noeviction`, not `allkeys-lru`. This instance holds BullMQ job state,
    # DistributedLockService locks and presence alongside the cache, and
    # `allkeys-lru` lets Redis discard any of them under memory pressure. An
    # evicted cache entry is harmless; an evicted job is silent loss in payouts
    # and reconciliation, and an evicted lock admits two workers to the same
    # critical section. BullMQ warns about exactly this on every queue at boot.
    #
    # The trade: at 2gb, writes now fail instead of silently dropping data —
    # loud and diagnosable rather than quiet and corrupting. If memory pressure
    # becomes real, split the cache onto a second Redis with its own LRU policy
    # rather than reverting this.
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ── API (single replica; use HPA in Kubernetes for multi-instance) ──────────
  api:
    # `build` is kept only as a manual escape hatch (`up -d --build`) for when the
    # registry is unreachable. Normal deploys PULL the image below — CI publishes
    # it from the exact commit that passed test + security-scan, and building on a
    # t3-class instance is slow and can OOM.
    build:
      context: .
      dockerfile: Dockerfile
    # Override IMAGE_TAG to pin a specific build (e.g. sha-<commit>) when rolling
    # back without moving the git checkout.
    image: ${DOCKER_IMAGE:-ghcr.io/tholuchuru-mahesh/soulzaa-backend}:${IMAGE_TAG:-latest}
    container_name: soulzaa-api
    restart: always
    logging: *default-logging
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # connection_limit is explicit because Prisma otherwise defaults to
      # `num_cpus * 2 + 1` — five connections on a 2-vCPU instance, against a
      # pgbouncer pool of 50. That mismatch is what put `BEGIN` in the
      # slow-query log at 126ms: not slow database work, but the client waiting
      # for a free slot. Keep this comfortably under PGBOUNCER_DEFAULT_POOL_SIZE.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}?schema=public&pgbouncer=true&connection_limit=20
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      # firebase.service.ts reads this from process.cwd() (/app), but the runtime
      # image deliberately copies only dist/node_modules/prisma — so mount it in.
      # Without it Firebase Admin never initializes and every phone-auth login
      # (POST /api/auth/login/firebase-mobile) fails to verify its ID token.
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # See Dockerfile — localhost resolves to ::1, the app listens on IPv4 only.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/live']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - backend
      - public

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: soulzaa-nginx
    restart: always
    logging: *default-logging
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # All of /etc/letsencrypt, not just live/ — the live/ certs are symlinks
      # into archive/, so mounting live/ alone gives nginx dangling links.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for the ACME HTTP-01 challenge, shared with host certbot so
      # renewals need only an nginx reload (no downtime, no cert copying).
      - ./deploy/nginx/acme:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - public

networks:
  backend:
    driver: bridge
    internal: true
  public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
