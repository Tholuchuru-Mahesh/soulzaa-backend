apiVersion: v1
kind: ConfigMap
metadata:
  name: soulzaa-config
  namespace: soulzaa-prod
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  CORS_ORIGINS: "https://soulzaa.com,https://app.soulzaa.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: soulzaa-secrets
  namespace: soulzaa-prod
type: Opaque
# Values are base64-encoded placeholders — replace with real secrets via
# `kubectl create secret generic soulzaa-secrets --from-env-file=.env.production`
# or inject via your cloud secrets manager (AWS Secrets Manager, GCP Secret Manager).
stringData:
  DATABASE_URL: "REPLACE_WITH_REAL_SECRET"
  DIRECT_URL: "REPLACE_WITH_REAL_SECRET"
  REDIS_URL: "REPLACE_WITH_REAL_SECRET"
  JWT_SECRET: "REPLACE_WITH_REAL_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_REAL_SECRET"
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_REAL_SECRET"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_REAL_SECRET"
  AWS_S3_BUCKET: "REPLACE_WITH_REAL_SECRET"
  AGORA_APP_ID: "REPLACE_WITH_REAL_SECRET"
  AGORA_APP_CERTIFICATE: "REPLACE_WITH_REAL_SECRET"
