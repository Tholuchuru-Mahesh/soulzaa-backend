apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soulzaa-ingress
  namespace: soulzaa-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # WebSocket upgrade for Socket.IO
    nginx.ingress.kubernetes.io/proxy-set-headers: "nginx-websocket-headers"
    nginx.ingress.kubernetes.io/upgrade: "websocket"
    nginx.ingress.kubernetes.io/connection-upgrade: "Upgrade"
    # TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "200"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.soulzaa.com
      secretName: soulzaa-tls
  rules:
    - host: api.soulzaa.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: soulzaa-api-service
                port:
                  number: 80
---
# Network Policy — restrict pod-to-pod traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soulzaa-api-netpol
  namespace: soulzaa-prod
spec:
  podSelector:
    matchLabels:
      app: soulzaa-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
        - podSelector:
            matchLabels:
              app: pgbouncer
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 6432
    - ports:
        - protocol: TCP
          port: 443    # External HTTPS (Agora, S3, Firebase)
        - protocol: UDP
          port: 53     # DNS (UDP — primary resolver path)
        - protocol: TCP
          port: 53     # DNS (TCP fallback for large responses)
      to: []
