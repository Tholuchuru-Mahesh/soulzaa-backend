events {
  worker_connections 4096;
}

http {
  # --- Security Headers ---
  add_header X-Frame-Options DENY;
  add_header X-Content-Type-Options nosniff;
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy "no-referrer-when-downgrade";
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data: https:;";

  # --- Gzip ---
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;
  gzip_min_length 1024;

  # --- Upstream ---
  upstream api {
    server api:3000;
    keepalive 64;
  }

  # --- HTTP → HTTPS redirect ---
  server {
    listen 80;
    server_name _;

    # ACME HTTP-01 challenge must be served over plain HTTP and must NOT be
    # redirected, or `certbot renew --webroot` fails and the cert silently
    # expires. `^~` stops prefix-match descent, so the `/` redirect can't win.
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      access_log off;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # --- HTTPS ---
  server {
    listen 443 ssl http2;
    server_name api.soulzaa.com;

    # Read straight out of /etc/letsencrypt so a renewal takes effect on reload.
    # These are symlinks into ../../archive, which is why the compose mount covers
    # all of /etc/letsencrypt rather than just live/.
    ssl_certificate     /etc/letsencrypt/live/api.soulzaa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.soulzaa.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # --- Health probes (public) ---
    location /health {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      access_log off;
    }

    # --- API ---
    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 90s;
    }
  }
}
